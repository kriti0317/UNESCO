{% extends 'main/base.html' %}

{% block title %}Login — Scam Verifier{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
    
    <div class="glass-card">
        <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; text-align: center; margin-bottom: 1.75rem;">
            Log in to access your scam verifications.
        </p>

        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.9rem; margin-bottom: 1.25rem;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'main:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; font-size: 1.05rem; padding: 0.8rem; margin-top: 0.5rem;">
                Log In
            </button>
        </form>

        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 1.5rem;">
            Don't have an account? <a href="{% url 'main:signup' %}">Sign up here</a>
        </p>
    </div>

</div>
{% endblock %}
